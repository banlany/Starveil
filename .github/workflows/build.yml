name: build

# 只手动触发：推代码、推 tag 都不会自动跑。
# 需要出包时在 Actions 页面点「Run workflow」（或本地 `gh workflow run build.yml`）。
# 版本号取自 src-tauri/tauri.conf.json，Release 的 tag 就是 `v<version>`。
# 两个 job 并行跑，各自往同一个 Release 传资产：windows 传 exe/zip，android 传 arm64 APK。
on:
  workflow_dispatch:

permissions:
  contents: write

# 两个 job 共用同一份 Release 说明。放在顶层 env 而不是各写一段 heredoc：
# heredoc 在 `run: |` 里必须缩进，缩进会被原样带进正文，Markdown 会把整段当代码块。
env:
  RELEASE_NOTES: |
    聚合直播客户端（哔哩哔哩 / 斗鱼 / 虎牙）。

    - Windows 安装包：`starveil-<版本>-x64-setup.exe`（NSIS）
    - Windows 免安装：解压 `starveil-<版本>-portable.zip` 直接运行 `starveil.exe`
    - Android：`starveil-<版本>-arm64.apk`（arm64-v8a，Android 8.0+）
    - 变更详情见仓库的 CHANGELOG.md

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 前端是纯静态的 HTML/CSS/ES Modules，没有 npm 构建步骤，
      # 只需要 Rust（版本由仓库里的 rust-toolchain.toml 指定）和系统自带的 WebView2。
      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # 直接从 crates.io 装 tauri-cli（它提供的命令就是 `cargo tauri`）。
      # 不用 taiki-e/install-action：它的 cargo-binstall 回退常被 GitHub API 限流而失败。
      # 版本与安卓 job 一起钉在 2.6.2：`^2` 每次跑都可能装到不同的最新版，
      # 出问题时没法判断是代码坏了还是 CLI 换了行为。
      - name: 安装 cargo-tauri
        shell: bash
        run: cargo install tauri-cli --version "2.6.2" --locked

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 读取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本：$VERSION"

      # 自己打包而不用 tauri-action，是因为 productName 是中文「星幕直播」：
      # NSIS bundler 生成的文件名会过滤掉非 ASCII 字符，
      # 装出来是 `_0.6.5_x64-setup.exe`（没有产品名前缀）。
      # 这里先打包，再统一改成 `starveil-<版本>-x64-setup.exe`，最后上传。
      # 发布资产一律走小写连字符（与本地 dist/ 一致），别再混用 `Starveil_` 那种写法。
      - name: 打包 NSIS 安装包
        run: cargo tauri build --bundles nsis

      - name: 重命名安装包
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          cd src-tauri/target/release/bundle/nsis
          for f in *.exe; do
            [ -e "$f" ] || continue
            mv "$f" "starveil-${VERSION}-x64-setup.exe"
            echo "重命名：$f -> starveil-${VERSION}-x64-setup.exe"
          done

      # 除了安装包，再单独提供免安装版，方便不想装东西的人。
      - name: 打包免安装版
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p portable
          cp src-tauri/target/release/starveil.exe portable/
          cp dist/README.txt portable/ 2>/dev/null || true
          7z a -tzip "starveil-${VERSION}-portable.zip" ./portable/* > /dev/null

      - name: 创建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}
          TITLE="星幕直播 v${VERSION}"
          NOTES="$RELEASE_NOTES"

          # 用 gh CLI 而不是 softprops/action-gh-release：
          # GITHUB_TOKEN 没有「更新已有 Release」的权限
          # （同一 tag 第二次发布时会报 Resource not accessible by integration），
          # 但资产级的增删是可以的。所以 Release 已存在就只补资产，不去改它的元信息。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" || true
          fi

          # 先传新的，再删旧的：反过来做的话，一旦上传失败就会出现
          # 「旧的已删、新的没传上」的空档，Release 里一个安装包都不剩。
          gh release upload "$TAG" \
            "src-tauri/target/release/bundle/nsis/starveil-${VERSION}-x64-setup.exe" \
            "starveil-${VERSION}-portable.zip" \
            --clobber

          # 清掉历史命名，免得同一个 Release 上挂着两份同内容资产：
          #   早期用中文 productName 直接打包 → `_0.4.0_x64-setup.exe`
          #   0.6.4 及以前 → `Starveil_<版本>_x64-setup.exe`、`starveil-portable.zip`
          # 新资产已经传上去了，这里删的只可能是旧名。
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              starveil-"$VERSION"-x64-setup.exe|starveil-"$VERSION"-portable.zip) continue ;;
            esac
            if echo "$asset" | grep -qE '^(_[0-9]|Starveil_[0-9])|^starveil-portable\.zip$'; then
              echo "删除旧资产：$asset"
              gh release delete-asset "$TAG" "$asset" || true
            fi
          done

          echo "=== Release 资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: starveil-windows-${{ steps.version.outputs.version }}
          path: |
            src-tauri/target/release/starveil.exe
            starveil-${{ steps.version.outputs.version }}-portable.zip
          if-no-files-found: warn

  # 安卓只出 arm64-v8a：真机全是 arm64，模拟器（x86_64）自己本地编就行，
  # 多编一个 ABI 只会让包大一倍、CI 多等十几分钟。
  # gen/android 是入库的工程，这里不跑 `tauri android init`，直接打包。
  android:
    runs-on: ubuntu-latest
    env:
      # 与本地 .tmp/env-android.sh 的 NDK 版本保持一致，改一处要改两处。
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # compileSdk / targetSdk 是 34（见 app/build.gradle.kts），JDK 要求 17。
      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK 解开有 700 MB 左右，缓存住能省掉每次一两分钟的下载。
      - name: 缓存 NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      # 不用 android-actions/setup-android@v3：
      #   1) 它 `packages` 的默认值就是 `tools`，而新 SDK 仓库里已经没有这个包，
      #      什么都不传也会报 `Failed to find package 'tools'` 整步失败；
      #   2) 传了的话它是按**空格**切分的，写成 YAML 多行会被当成一个包名。
      # 镜像本来就带 cmdline-tools，直接找它的 sdkmanager 用，少一层依赖。
      - name: 安装 Android SDK 与 NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # 目录名是版本号（最近成了 `16.0`，以前是 `latest`），挨个试比写死稳。
          SDKMANAGER=""
          for cand in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$cand" ]; then SDKMANAGER="$cand"; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::没找到 sdkmanager，SDK 目录内容："
            ls -R "$SDK/cmdline-tools" || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdkmanager: $SDKMANAGER"
          # 包名按「一个参数一个包」传，别拼成字符串。
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"
          # NDK 装没装对决定后面 ring / C 代码能不能交叉编译，先确认再往下走。
          test -d "${SDK}/ndk/${NDK_VERSION}"
          echo "NDK: ${SDK}/ndk/${NDK_VERSION}"

      # 版本跟仓库的 rust-toolchain.toml 对齐（那里固定 1.95.0）。
      # 那个文件只列了 Windows 的 target，安卓 target 必须在这里显式加。
      - name: 准备 Rust 工具链
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android

      # 用 npm 的预编译二进制：linux 上 `cargo install tauri-cli` 要现场编译十几分钟。
      # 版本钉死成本地验证过的 2.6.2：`@^2` 会装到最新版，而 gen/android 工程是
      # 2.6.2 生成的，新版 CLI 有可能改 gradle 任务或参数名，本地能过、CI 报错最难查。
      - name: 安装 tauri-cli
        run: npm install -g @tauri-apps/cli@2.6.2

      # gradle 的 `rustBuild<Abi><Profile>` 任务（buildSrc 的 BuildTask.kt）是写死
      # `cargo tauri android android-studio-script` 的，靠它把 Rust 编出来并 symlink
      # 到 jniLibs。而 npm 装的只有 `tauri` 这**一个**可执行文件，没有 cargo 子命令，
      # 于是那一步报 `error: no such command: 'tauri'`，exit 101。
      # 两条路：`cargo install tauri-cli`（现场编译十几分钟）或放个转发脚本。
      # 选后者——npm 版与 cargo 版是同一个 CLI 的同一版本，转发过去行为一致；
      # 而且不用为它再维护一份几百 MB 的构建缓存。
      #
      # 容易踩的一点：cargo 执行外部子命令时**会把子命令名一起传进去**，
      # `cargo tauri --version` 实际调的是 `cargo-tauri tauri --version`。
      # 脚本里必须先把这个 "tauri" 丢掉，否则 CLI 收到 `tauri tauri --version`，
      # 报 `unrecognized subcommand 'tauri'`。
      - name: 让 cargo 认得 tauri 子命令
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cargo-bin"
          cat > "$RUNNER_TEMP/cargo-bin/cargo-tauri" <<'SH'
          #!/bin/sh
          # cargo 会把子命令名作为第一个参数传进来，去掉它再交给真正的 CLI。
          if [ "${1:-}" = "tauri" ]; then shift; fi
          exec tauri "$@"
          SH
          chmod +x "$RUNNER_TEMP/cargo-bin/cargo-tauri"
          echo "$RUNNER_TEMP/cargo-bin" >> "$GITHUB_PATH"
          # GITHUB_PATH 只对后续步骤生效，这里临时挂上去当场验一遍（顺便验证 shift 逻辑）
          PATH="$RUNNER_TEMP/cargo-bin:$PATH" cargo tauri --version

      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-aarch64

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # cargo-mobile2 靠 ANDROID_HOME / NDK_HOME 找 SDK 和交叉编译工具链
      # （C 代码如 ring 要用 NDK 里的 clang），缺一个就会在编译到一半时失败。
      - name: 导出安卓构建环境
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK="$SDK/ndk/${NDK_VERSION}"
          # prebuilt 目录按宿主命名，Linux runner 固定是 linux-x86_64。
          LLVM_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$LLVM_BIN"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          # 把 NDK 的 clang 放进 PATH。cc-rs（ring、其它带 C 代码的依赖）会自己按
          # ANDROID_NDK_HOME 去找，但版本更新的 cc-rs 才认这个变量；显式给 CC/AR 更稳，
          # 名字要带 API level（NDK 只提供 aarch64-linux-android24-clang），24 对齐 minSdk。
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$LLVM_BIN/llvm-ar" >> "$GITHUB_ENV"

      # 正式签名，密钥来自仓库 Secrets：
      #   ANDROID_KEYSTORE_BASE64    keystore/starveil-release.jks 的 base64
      #   ANDROID_KEYSTORE_PASSWORD  storePassword（未单独设 KEY_PASSWORD 时 keyPassword 同值）
      #   ANDROID_KEY_ALIAS          默认 starveil
      #   ANDROID_KEY_PASSWORD       可选，仅当 keyPassword ≠ storePassword
      #
      # 为什么必须固定：这里以前是 `keytool -genkeypair` 现造一个 debug keystore，
      # 而 runner 每次都是干净环境、没有缓存 `~/.android`，于是**每跑一次构建就换一把钥匙**。
      # 安卓覆盖安装要求包名和签名都相同，签名变了系统就当成另一个应用，
      # 只能先卸载旧版（数据一起没），报错还只说「应用未安装」。
      # 现在一把钥匙用到 2126 年，v0.6.4 之后从旧 debug 签名换过来仍需卸载最后一次，
      # 再往后就能直接覆盖升级。
      - name: 恢复正式签名
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD，签不出固定指纹的包"
            exit 1
          fi
          echo "::add-mask::$KS_PASS"
          KEY_PASS="${KEY_PASS:-$KS_PASS}"
          echo "::add-mask::$KEY_PASS"

          KS_FILE="$RUNNER_TEMP/starveil-release.jks"
          # printf 不用 echo：secret 里的反斜杠不该被解释。base64 解码忽略换行。
          printf '%s' "$KS_B64" | base64 -d > "$KS_FILE"
          test -s "$KS_FILE"

          {
            echo "STARVEIL_KEYSTORE_FILE=$KS_FILE"
            echo "STARVEIL_KEYSTORE_PASSWORD=$KS_PASS"
            echo "STARVEIL_KEY_ALIAS=${KEY_ALIAS:-starveil}"
            echo "STARVEIL_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          # 指纹打进发布日志：以后核对「这版和上版是不是同一把钥匙」用得上。
          # 用 $JAVA_HOME 里的 keytool，不指望它已经在 PATH 上。
          "$JAVA_HOME/bin/keytool" -list -v -keystore "$KS_FILE" -storepass "$KS_PASS" 2>/dev/null \
            | grep -E "Alias name|SHA256:" || true

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本：$VERSION"

      # 这几张启动图标是 `tauri android init` 生成的，`android build` 不会补；
      # 仓库根 .gitignore 有条全局 `*.png`，当初就把它们一起挡在仓库外，
      # CI 全新检出后 aapt2 报 `resource mipmap/ic_launcher not found`，
      # 而且要等 Rust 编完（3 分钟）才炸。这里提前几秒说清楚。
      - name: 检查安卓必需资源
        run: |
          set -euo pipefail
          RES=src-tauri/gen/android/app/src/main/res
          missing=0
          for f in mipmap-mdpi/ic_launcher.png mipmap-hdpi/ic_launcher.png \
                   mipmap-xhdpi/ic_launcher.png mipmap-xxhdpi/ic_launcher.png \
                   mipmap-xxxhdpi/ic_launcher.png; do
            if [ ! -f "$RES/$f" ]; then
              echo "::error::缺少 $RES/$f（AndroidManifest 引用了 @mipmap/ic_launcher）"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # --ci 由 Actions 自带的 CI=true 触发，跳过所有交互提示。
      # 产物在 app/build/outputs/apk/universal/release/ 下（文件名由 productName 决定，
      # 中文会被过滤，所以下面统一改名成 ASCII）。
      - name: 打包 arm64 APK
        run: tauri android build --target aarch64 --apk

      - name: 重命名并校验 APK
        id: apk
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          OUT_DIR=src-tauri/gen/android/app/build/outputs/apk
          # signingConfig 配好后 gradle 直接出已签名的 app-universal-release.apk。
          # 拿不到就说明签名没注入成功——这里**故意不用 debug key 兜底**：
          # 那样打出来的包指纹又变了，发出去又是一个「必须卸载才能装」的版本，
          # 比构建失败更难发现。
          APK=$(find "$OUT_DIR" -name "*release*.apk" ! -name "*unsigned*" | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::error::没找到已签名的 release APK，检查上一步「恢复正式签名」"
            find "$OUT_DIR" -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK: $APK"

          # 先找 Linux/macOS 那个无扩展名的 `apksigner`；Windows 的 build-tools 里只有
          # apksigner.bat，所以留个回退。不能直接写 `-name "apksigner*"`：Linux 的
          # build-tools 里两个都有，`sort | tail -1` 会挑到 .bat，在 Linux 上根本跑不起来。
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner" | sort | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name "apksigner.bat" | sort | tail -1)
          fi
          echo "apksigner: $APKSIGNER"

          OUT="starveil-${VERSION}-arm64.apk"
          cp "$APK" "$OUT"

          # 装不上的包不如不传：验签顺带把证书指纹写进日志。
          "$APKSIGNER" verify --print-certs "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}
          TITLE="星幕直播 v${VERSION}"
          # 与 windows job 共用顶层 env 的那份说明：两个 job 并行，谁先跑到谁创建 Release。
          NOTES="$RELEASE_NOTES"

          # 两个 job 会同时抢着创建 Release，用「建不上就等别人建好」的循环兜住。
          for _ in $(seq 1 12); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA" >/dev/null 2>&1 || true
            sleep 5
          done
          gh release view "$TAG" >/dev/null

          gh release upload "$TAG" "${{ steps.apk.outputs.path }}" --clobber

          # 旧命名（`Starveil_<版本>_arm64.apk`）在同一个 tag 重跑时会残留，
          # 和新包内容一样却占两份下载，这里一并清掉。
          CURRENT="starveil-${VERSION}-arm64.apk"
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            [ "$asset" = "$CURRENT" ] && continue
            if echo "$asset" | grep -qE '^Starveil_[0-9].*_arm64\.apk$'; then
              echo "删除旧资产：$asset"
              gh release delete-asset "$TAG" "$asset" || true
            fi
          done

          echo "=== Release 资产 ==="
          gh release view "$TAG" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: starveil-android-arm64-${{ steps.version.outputs.version }}
          path: starveil-*-arm64.apk
          if-no-files-found: warn
