<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-skin="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark light" />
  <title>Starveil</title>
  <link rel="icon" href="assets/logo.png" />
  <!-- 首帧前先判定平台：移动端没有自绘标题栏、侧栏要挪到底部，
       等 app.js 执行再切会先闪一下桌面布局。 -->
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var android = /Android/i.test(ua);
      var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var root = document.documentElement;
      if (android || ios) {
        root.classList.add('is-mobile');
        root.dataset.platform = android ? 'android' : 'ios';
      } else {
        root.dataset.platform = 'desktop';
      }
    })();
  </script>
  <!-- 皮肤与明暗必须在首帧前定下来：
       皮肤文件只声明 CSS 变量，晚一步加载会先闪一帧默认配色，
       浅色模式更是会先黑一下。这条内联脚本读 store.js 写的预涂缓存
       （starveil.boot.v1），再按 `skins/<id>/skin.css` 的约定插入样式表。
       路径规则和 skins/registry.js 的 skinHref() 必须一致。 -->
  <script>
    (function () {
      var href = 'skins/default/skin.css';
      var root = document.documentElement;
      try {
        var boot = JSON.parse(localStorage.getItem('starveil.boot.v1') || '{}');
        if (boot.skin && /^[a-z0-9][a-z0-9-]{1,31}$/.test(boot.skin)) {
          root.dataset.skin = boot.skin;
          href = 'skins/' + boot.skin + '/skin.css';
        }
        if (boot.theme === 'light' || boot.theme === 'dark') root.dataset.theme = boot.theme;
        root.dataset.themeMode = boot.theme || 'dark';
      } catch (e) {
        /* 缓存坏了就用默认皮肤 + 深色，applyTheme 跑起来会纠正 */
      }
      document.write('<link rel="stylesheet" id="skin-css" href="' + href + '">');
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pages.css" />
  <link rel="stylesheet" href="room.css" />
  <!-- 移动端覆盖层：只在 <html class="is-mobile"> 下生效，桌面不受影响 -->
  <link rel="stylesheet" href="mobile.css" />
</head>
<body>
  <!-- 自绘标题栏：跟随主题色，关闭按钮悬停变红；拖动区交给系统处理窗口移动
       （无边框窗口拿不到系统的贴边吸附 Aero Snap） -->
  <header class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="titlebar-brand" data-tauri-drag-region>
      <img class="titlebar-logo" src="assets/logo.png" alt="" draggable="false" />
      <span class="titlebar-name" data-tauri-drag-region>Starveil</span>
    </div>
    <!-- 窗口按钮的图形由 titlebar.js 填（icons.js 的 winIcon）：
         写在这里等于把线宽钉死，皮肤改不动。 -->
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="tb-min" title="最小化" aria-label="最小化"></button>
      <button class="titlebar-btn" id="tb-max" title="最大化" aria-label="最大化"></button>
      <button class="titlebar-btn titlebar-close" id="tb-close" title="关闭" aria-label="关闭"></button>
    </div>
  </header>

  <!-- 无边框窗口的缩放热区：decorations:false 会去掉 WS_THICKFRAME，四边要自己补 -->
  <div class="resize-handle" data-direction="North"></div>
  <div class="resize-handle" data-direction="South"></div>
  <div class="resize-handle" data-direction="West"></div>
  <div class="resize-handle" data-direction="East"></div>
  <div class="resize-handle" data-direction="NorthWest"></div>
  <div class="resize-handle" data-direction="NorthEast"></div>
  <div class="resize-handle" data-direction="SouthWest"></div>
  <div class="resize-handle" data-direction="SouthEast"></div>

  <div id="app" class="app">
    <aside class="rail" id="rail">
      <div class="rail-top">
        <button class="rail-btn" data-nav="home" title="首页" aria-label="首页"></button>
        <button class="rail-btn" data-nav="follow" title="关注" aria-label="关注"></button>
        <button class="rail-btn" data-nav="category" title="分类" aria-label="分类"></button>
        <button class="rail-btn" data-nav="settings" title="设置" aria-label="设置"></button>
      </div>
      <div class="rail-bottom">
        <button class="rail-btn rail-mini" data-action="theme" title="切换深浅色" aria-label="切换深浅色"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <div class="platform-tabs" id="platform-tabs" role="tablist"></div>
        <div class="topbar-actions">
          <button class="icon-btn topbar-refresh" id="topbar-refresh" title="刷新推荐" aria-label="刷新推荐" hidden></button>
          <button class="icon-btn topbar-search" id="topbar-search" title="搜索" aria-label="搜索"></button>
        </div>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="vendor/mpegts.js"></script>
  <!-- HLS 线路：hls.js 走 MSE；iOS/WKWebView 上它会自己不可用，退回原生 HLS -->
  <script src="vendor/hls.js"></script>
  <script src="vendor/fly-barrage.js"></script>
  <script src="vendor/cryptojs.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
