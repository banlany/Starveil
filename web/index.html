<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark light" />
  <title>星幕直播</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pages.css" />
  <link rel="stylesheet" href="room.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="rail" id="rail">
      <div class="rail-top">
        <button class="rail-btn" data-nav="home" title="首页" aria-label="首页"></button>
        <button class="rail-btn" data-nav="follow" title="关注" aria-label="关注"></button>
        <button class="rail-btn" data-nav="category" title="分类" aria-label="分类"></button>
        <button class="rail-btn" data-nav="settings" title="设置" aria-label="设置"></button>
      </div>
      <div class="rail-bottom">
        <button class="rail-btn rail-mini" data-action="theme" title="切换深浅色" aria-label="切换深浅色"></button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar" id="topbar">
        <div class="platform-tabs" id="platform-tabs" role="tablist"></div>
        <button class="icon-btn topbar-search" id="topbar-search" title="搜索" aria-label="搜索"></button>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="vendor/mpegts.js"></script>
  <script src="vendor/fly-barrage.js"></script>
  <script src="vendor/cryptojs.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
