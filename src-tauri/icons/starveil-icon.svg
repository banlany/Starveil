<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="星幕直播">
  <title>星幕直播 Starveil</title>

  <!-- 白色圆角底。圆角外是透明的，放在深色任务栏/启动器里不会变成一个白方块。 -->
  <rect width="1024" height="1024" rx="228" fill="#ffffff" />

  <!-- 天幕。上缘是半径 360 的半圆穹顶，两侧直落，下摆用 Q 弧中间垂 60——像一块挂起来、
       被自身重量拽住的天幕布。左右各留 152 的白边，顶 152、底约 158，四周留白基本相等。

       颜色是夜空靛蓝。这是「天幕」最不反直觉的取值：天幕本来就是夜空，而蓝和金是补色，
       金色星在靛蓝上最跳。同时也避开了主题色——App 里的主题色是 8 个预设 + 自定义色值，
       用户随时能改成绿色或橙色，图标绑上去就等于每换一次主题品牌就变一次。
       试过的其他取值都不如它：深紫偏梦幻不偏夜空；近黑在深色任务栏上糊成一块；
       深酒红是舞台幕布色但与「星」不同源；墨青读起来像别的东西。 -->
  <path fill="#1e2a5a" d="M152 512A360 360 0 0 1 872 512L872 806Q512 866 152 806Z" />

  <!-- 三颗小星，对应 App 聚合的三个平台的品牌色：黄（快手）/ 粉（B 站）/ 黑（抖音）。
       全部落在主星四尖之间的对角空当里——主星在正上、正下、正左、正右方向顶到 272，
       但在 45° 方向只有 140（星腰），对角才是能放东西的地方，也不会顶到天幕边缘。
       三颗角度各不相同（-14° / 20° / -26°），免得像三枚正着摆的图钉。

       黑星必须带白边：靛蓝底上纯黑几乎不可见（试过，只剩一个暗点）。
       因此白边取到 8——芯尽量大、边尽量细，读起来是「描了边的黑星」而不是「白星」。
       白边再粗一档（12）就会整颗读成白色，失去黑色这层意思。 -->
  <g>
    <path fill="#ffcf4d" transform="rotate(-14 300 300)" d="M300 254A64.9 64.9 0 0 0 346 300A64.9 64.9 0 0 0 300 346A64.9 64.9 0 0 0 254 300A64.9 64.9 0 0 0 300 254Z" />
    <path fill="#fb7299" transform="rotate(20 722 306)" d="M722 272A47.9 47.9 0 0 0 756 306A47.9 47.9 0 0 0 722 340A47.9 47.9 0 0 0 688 306A47.9 47.9 0 0 0 722 272Z" />
    <path fill="#05070d" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" transform="rotate(-26 724 722)" d="M724 688A47.9 47.9 0 0 0 758 722A47.9 47.9 0 0 0 724 756A47.9 47.9 0 0 0 690 722A47.9 47.9 0 0 0 724 688Z" />
  </g>

  <!-- 主星：四角星芒，落在天幕正中。四个尖点之间用 1.41 倍尖半径的圆弧相连，弧朝圆心凹进去，
       星腰约为半径的一半：再小会塌成细十字，再大就变成圆角菱形。
       金黄和靛蓝是补色，缩到 24px 依然是一个亮点。 -->
  <path fill="#fbbe28" d="M512 240A383.5 383.5 0 0 0 784 512A383.5 383.5 0 0 0 512 784A383.5 383.5 0 0 0 240 512A383.5 383.5 0 0 0 512 240Z" />

  <!-- 播放三角。外接框中心取 524（星心 512 右移 12），不是 512，也不是它的面积质心。

       三角形左边的竖直边长 174，视觉重量集中在这一侧；右侧收成尖，面积占比小，
       但尖端是有方向感的——眼睛会顺着它往外看，等于尖端在右侧「占」了一段空间。
       实测（像素统计，1024 坐标）：这颗三角的质心在 486.2，比外接框中心偏左 25.8。
       三种对齐试下来——外接框对齐 512 看着明显偏左，质心对齐（框心 531）又明显偏右，
       526 附近最稳。取 524，即外接框右移宽度的 1/12（148/12≈12），
       这也是播放键居中的常用值，介于几何中点与质心之间、更靠近质心一侧。

       三个角靠 42 宽的圆头描边磨圆，因此路径本身比成品各边小 21。
       白色是播放器的通用语言，换成彩色会丢辨识度，也会和金色打架。 -->
  <path fill="#ffffff" stroke="#ffffff" stroke-width="42" stroke-linejoin="round" d="M450 425v174l148-87Z" />
</svg>
