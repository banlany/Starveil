[package]
name = "live_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "聚合直播协议层：哔哩哔哩 / 斗鱼 / 虎牙"
license = "MIT"

[lib]
name = "live_core"
path = "src/lib.rs"

# Tauri 版不需要在 Rust 侧执行斗鱼签名（签名在 WebView 里完成），
# 因此不引入 boa，保持依赖精简。
[features]
default = []

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
form_urlencoded = "1"
md5 = "0.7"
percent-encoding = "2"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.24", features = ["handshake", "rustls-tls-webpki-roots"] }

# TLS 后端按平台分流：
# - 桌面用系统 TLS（Windows = SChannel）：斗鱼弹幕服务器只接受它，rustls 会被
#   `HandshakeFailure` 拒绝。
# - Android/iOS 上没有 SChannel，`native-tls` 会去拉 openssl（Android 编不过），
#   所以切到 rustls；代价是斗鱼弹幕在移动端连不上（见 `danmaku.rs` 的说明）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
] }
native-tls = "0.2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "charset",
] }
