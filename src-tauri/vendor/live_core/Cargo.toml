[package]
name = "live_core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "聚合直播协议层：哔哩哔哩 / 斗鱼 / 虎牙"
license = "MIT"

[lib]
name = "live_core"
path = "src/lib.rs"

# Tauri 版不需要在 Rust 侧执行斗鱼签名（签名在 WebView 里完成），
# 因此不引入 boa，保持依赖精简。
[features]
default = []

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
form_urlencoded = "1"
md5 = "0.7"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "native-tls",
    "charset",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
native-tls = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tungstenite = { version = "0.24", features = ["handshake", "rustls-tls-webpki-roots"] }
